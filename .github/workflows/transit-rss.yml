name: Update TRANSIT RSS

on:
  push:
    branches: [main]
    paths:
      - "transit-rss/generate_feed.py"
      - "transit-rss/requirements.txt"
      - ".github/workflows/transit-rss.yml"
  schedule:
    # Once a day at 22:17 UTC = 07:17 JST
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transit-rss
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: transit-rss/requirements.txt

      - name: Install dependencies
        run: pip install -r transit-rss/requirements.txt

      - name: Generate feed
        run: python transit-rss/generate_feed.py

      - name: Commit feed when changed
        run: |
          if git diff --quiet -- transit-rss/feed.xml; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transit-rss/feed.xml
          git commit -m "Update TRANSIT RSS"
          git push
