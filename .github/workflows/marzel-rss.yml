name: Update MARZEL RSS

on:
  push:
    branches: [main]
    paths:
      - "marzel-rss/generate_feed.py"
      - "marzel-rss/requirements.txt"
      - ".github/workflows/marzel-rss.yml"
  schedule:
    # Once a day at 22:47 UTC = 07:47 JST
    - cron: "47 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marzel-rss
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: marzel-rss/requirements.txt
      - run: pip install -r marzel-rss/requirements.txt
      - run: python marzel-rss/generate_feed.py
      - name: Commit feed when changed
        run: |
          if git diff --quiet -- marzel-rss/feed.xml; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marzel-rss/feed.xml
          git commit -m "Update MARZEL RSS"
          git push
