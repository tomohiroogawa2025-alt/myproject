name: Update goofy.jp Instagram RSS

on:
  push:
    branches: [main]
    paths:
      - "instagram-goofy-rss/update_feed.py"
      - "instagram-goofy-rss/requirements.txt"
      - ".github/workflows/goofy-instagram-rss.yml"
  schedule:
    # Once daily at 22:37 UTC = 07:37 JST
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goofy-instagram-rss
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram-goofy-rss/requirements.txt
      - run: pip install -r instagram-goofy-rss/requirements.txt
      - run: python instagram-goofy-rss/update_feed.py
      - name: Commit feed when changed
        run: |
          if git diff --quiet -- instagram-goofy-rss/feed.xml; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-goofy-rss/feed.xml
          git commit -m "Update goofy.jp Instagram RSS"
          git push
