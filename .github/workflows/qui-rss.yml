name: Update QUI RSS

on:
  push:
    branches: [main]
    paths:
      - "qui-rss/generate_feed.py"
      - "qui-rss/requirements.txt"
      - ".github/workflows/qui-rss.yml"
  schedule:
    # Once a day at 23:07 UTC = 08:07 JST
    - cron: "7 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qui-rss
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qui-rss/requirements.txt
      - run: pip install -r qui-rss/requirements.txt
      - run: python qui-rss/generate_feed.py
      - name: Commit feed when changed
        run: |
          if [ -z "$(git status --porcelain -- qui-rss/feed.xml)" ]; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qui-rss/feed.xml
          git commit -m "Update QUI RSS"
          git push
